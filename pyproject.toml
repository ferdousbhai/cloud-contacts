[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cloud-contacts"
version = "0.3.1"
description = "Unified iCloud and Google contacts with a native GTK app"
requires-python = ">=3.10"
license = "MIT"

[project.scripts]
cloud-contacts = "cloud_contacts.cli:main"

[tool.setuptools]
packages = ["cloud_contacts"]
