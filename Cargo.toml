[workspace]
members = ["crates/cloud-contacts"]
resolver = "3"

[workspace.package]
version = "0.4.4"
edition = "2024"
license = "MIT"
repository = "https://github.com/ferdousbhai/cloud-contacts"

[workspace.dependencies]
# What every iCloud app on this machine shares, from icloud-for-omarchy, pinned by commit:
# icloud-session (the one web sign-in icloud-sessiond holds), icloud-app (the command lines'
# helpers, an app's data directory and JSON files) and icloud-app-ui (the sign-in banner).
icloud-session = { git = "https://github.com/ferdousbhai/icloud-for-omarchy", rev = "66ac64914939a77cb43b4eaf01dfcfaa6c9d6aa2", features = ["clap"] }
icloud-app = { git = "https://github.com/ferdousbhai/icloud-for-omarchy", rev = "66ac64914939a77cb43b4eaf01dfcfaa6c9d6aa2" }
icloud-app-ui = { git = "https://github.com/ferdousbhai/icloud-for-omarchy", rev = "66ac64914939a77cb43b4eaf01dfcfaa6c9d6aa2" }
# The window's look, theme and widgets, which the Omarchy apps share; no libadwaita.
omui = { git = "https://github.com/ferdousbhai/omui", rev = "2d34cf50a29a8ad5338d94d4d9e46c1587f7ef40" } # v0.4.0
gtk = { package = "gtk4", version = "0.11", features = ["v4_22"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tiny_http = "0.12"
toml = "1"
url = "2"
uuid = { version = "1", features = ["v4"] }

# icloud-for-omarchy's main still pins omui 0.3.1, and two omuis would register the same GTK types twice, so its
# icloud-app-ui is given this one too. Cargo takes no patch to the URL it patches, hence www.github.com (it redirects to
# github.com). Delete this once icloud-for-omarchy pins v0.4.0.
[patch."https://github.com/ferdousbhai/omui"]
omui = { git = "https://www.github.com/ferdousbhai/omui", rev = "2d34cf50a29a8ad5338d94d4d9e46c1587f7ef40" } # v0.4.0

[profile.release]
lto = "thin"
strip = true
