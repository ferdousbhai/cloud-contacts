[workspace]
members = ["crates/cloud-contacts"]
resolver = "3"

[workspace.package]
version = "0.4.4"
edition = "2024"
license = "MIT"
repository = "https://github.com/ferdousbhai/cloud-contacts"

[workspace.dependencies]
# What every iCloud app on this machine shares, from icloud-for-omarchy, pinned by commit:
# icloud-session (the one web sign-in icloud-sessiond holds), icloud-app (the command lines'
# helpers, an app's data directory and JSON files) and icloud-app-ui (the sign-in banner and the
# window's main).
icloud-session = { git = "https://github.com/ferdousbhai/icloud-for-omarchy", rev = "393ec0632742cfcb24492594f709069d1e52ebc2", features = ["clap"] }
icloud-app = { git = "https://github.com/ferdousbhai/icloud-for-omarchy", rev = "393ec0632742cfcb24492594f709069d1e52ebc2" }
icloud-app-ui = { git = "https://github.com/ferdousbhai/icloud-for-omarchy", rev = "393ec0632742cfcb24492594f709069d1e52ebc2" }
adw = { package = "libadwaita", version = "0.9", features = ["v1_9"] }
gtk = { package = "gtk4", version = "0.11", features = ["v4_22"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
tiny_http = "0.12"
toml = "1"
url = "2"
uuid = { version = "1", features = ["v4"] }

[profile.release]
lto = "thin"
strip = true
