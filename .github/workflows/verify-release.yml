name: Verify published release
on:
  release:
    types: [published]
  workflow_dispatch:  # re-verify a published release with this commit's script
    inputs:
      tag:
        description: Release tag, e.g. v0.3.0
        required: true
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.sha }}
      - name: Prepare native Arch Linux ARM image
        if: matrix.arch == 'aarch64'
        run: |
          curl --fail --location --retry 3 https://ca.us.mirror.archlinuxarm.org/os/ArchLinuxARM-aarch64-latest.tar.gz -o /tmp/archlinuxarm.tar.gz
          docker import /tmp/archlinuxarm.tar.gz cloud-contacts-archlinuxarm:ci
      - name: Verify the triggering release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
          ARM_BUILD_IMAGE: cloud-contacts-archlinuxarm:ci
        run: bin/verify-release "${RELEASE_TAG#v}" '${{ matrix.arch }}'
